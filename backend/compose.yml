services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: teamspace
      POSTGRES_USER: teamspace
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - teamspace-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamspace"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/teamspace
      DATABASE_USER: teamspace
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set a base64 32-byte JWT_SECRET}
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:5173
      EMAIL_ENABLED: "true"
      SMTP_HOST: mailpit
volumes:
  teamspace-db:
